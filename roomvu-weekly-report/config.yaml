# ai_analysis is a FUTURE slide property — not implemented in v1.
metabase_url_env: METABASE_URL
metabase_api_key_env: METABASE_API_KEY
supermetrics_api_key_env: SUPERMETRICS_API_KEY
google_ads_account_id: "4594075026"
linkedin_ads_account_id: "508540143"

deck:
  title: "Roomvu — Weekly ROI Cohort Report"
  shade_scale: [0, 150]        # % clamp range for cell color
  break_even: 100              # % anchor for red/green split

slides:
  - id: insurance_roi
    title: "Meta · Insurance Agents — ROI Cohort (Weekly)"
    render: cohort_ratio       # cells = revenue (8515) / spend (8516) per cohort week
    platform: meta
    revenue_q: 8515            # Meta – Insurance ROI Cohort — REVENUE (db 6)
    spend_q: 8516              # Meta – Insurance ROI Cohort — SPEND (db 74)
    cohort_anchor: "2026-05-06"  # anchor in 8515/8516; blanks immature Wn windows
  - id: financial_planners_roi
    metabase_question: 8271
    title: "Meta · Financial Planners — ROI Cohort (Weekly)"
    render: cohort_table
    platform: meta
  - id: realtors_roi
    title: "Meta · Realtors — ROI Cohort (Weekly)"
    render: cohort_ratio
    platform: meta
    revenue_q: 8517            # REALTOR REVENUE (db 6)
    spend_q: 8518              # REALTOR SPEND (db 74)
    cohort_anchor: "2026-05-06"
  - id: mortgage_roi
    metabase_question: 8280
    title: "Meta · Mortgage Brokers — ROI Cohort (Weekly)"
    render: cohort_table
    platform: meta

  # Real Estate & Mortgage Broker across BOTH platforms, on the same weekly
  # cohort grid / W1..W5 maturity windows as 8515–8518. Computed live because
  # Google spend lives in Supermetrics, not Metabase:
  #   revenue = cohort users from the Meta Realtor+Mortgage campaigns OR Google
  #             (all Google campaigns except the Insurance/Financial verticals)
  #   spend   = Meta ad_analytics (8516 shape) + Google Supermetrics daily cost
  - id: re_mb_roi_meta_google
    title: "Meta & Google · Real Estate & Mortgage Brokers — ROI Cohort (Weekly)"
    render: cohort_combined
    cohort_anchor: "2026-05-06"
    revenue_database_id: 6      # roomview-website (users/financials)
    spend_database_id: 74       # roomvu_ads_metrics (ad_analytics)
    meta_campaigns:
      - "120231753483890603"    # Realtor
      - "120233281815980603"    # Mortgage Broker
    google_exclude_campaigns:   # Google = everything except these verticals
      - "22605096945"           # RV - Registration - Insurance Agents
      - "22448879276"           # RV - Registration - Financial Advisors
      - "23737726709"           # RV - Registration - Competitors [Insurance Agent]
      - "23735196152"           # RV - Registration - Competitors [Financial Advisor]
    note: "Meta: Realtor + Mortgage Broker campaigns · Google: all campaigns except Insurance Agents / Financial Advisors. Cells = combined cumulative revenue ÷ combined spend (Meta ad_analytics + Google Supermetrics)."

  # ── Meta KPI slides (Metabase) ────────────────────────────────
  - id: meta_insurance_kpi
    title: "Meta - Insurance Agents Registration"
    render: meta_kpi
    platform: meta
    metabase_question_registrations: 8330
    metabase_question_spend: 8331
    creative_file: "insurance.jpg"   # filename inside roomvu-weekly-report/assets/creatives/

  - id: meta_financial_kpi
    title: "Meta - Financial Planners Registration"
    render: meta_kpi
    platform: meta
    metabase_question_registrations: 8337
    metabase_question_spend: 8336
    creative_file: "financial.jpg"

  - id: meta_realtors_kpi
    title: "Meta - Realtors Registration"
    render: meta_kpi
    platform: meta
    metabase_question_registrations: 8334
    metabase_question_spend: 8335
    creative_file: ""

  - id: meta_mortgage_kpi
    title: "Meta - Mortgage Brokers Registration"
    render: meta_kpi
    platform: meta
    metabase_question_registrations: 8332
    metabase_question_spend: 8333
    creative_file: "mortgage.jpg"

  # ── Meta line chart slides (Metabase) ─────────────────────────
  - id: meta_realestate_spend
    title: "Meta - Real Estate & MB Spend"
    render: line_chart
    platform: meta
    charts:
      - label: "Weekly Spend"
        source: metabase
        metabase_question: 8338
        x_field: week
        y_field: amount_spent
        format: currency
        color: "#6B7FD4"

  - id: meta_realestate_sub_rate
    title: "Meta - Real Estate & MB Subscription Rate"
    render: line_chart
    platform: meta
    charts:
      - label: "Subscription Rate"
        source: metabase
        metabase_question: 8340
        x_field: week
        y_field: subscription_rate_pct
        format: percent
        color: "#6B7FD4"

  - id: meta_total_return_rate
    title: "Meta - Total Return Rate (MB + Realtor)"
    render: line_chart
    platform: meta
    charts:
      - label: "Total Return Rate"
        source: metabase_ratio
        metabase_question_numerator: 8341
        metabase_question_denominator: 8342
        join_field: week_idx
        x_field: week
        numerator_field: total_revenue
        denominator_field: spend
        format: percent
        color: "#4A90D9"

  - id: meta_realestate_cpa
    title: "Meta - Real Estate Acquisition CPA"
    render: line_chart
    platform: meta
    charts:
      - label: "CPA"
        source: metabase
        metabase_question: 8343
        x_field: week
        y_field: cpa
        format: currency
        color: "#E8A020"

  - id: meta_insurance_spend
    title: "Meta - Insurance Agents Spend"
    render: line_chart
    platform: meta
    charts:
      - label: "Weekly Spend"
        source: metabase
        metabase_question: 8344
        x_field: week
        y_field: amount_spent
        format: currency
        color: "#6B7FD4"

  - id: meta_insurance_cpa_register
    title: "Meta - Insurance Agents CPA & Register Weekly"
    render: dual_line_chart
    platform: meta
    charts:
      - label: "Registrations"
        source: metabase
        metabase_question: 8345
        x_field: week
        y_field: Register
        format: number
        color: "#E8956D"
      - label: "CPA"
        source: metabase
        metabase_question: 8345
        x_field: week
        y_field: CPA
        format: currency
        color: "#E8C84A"

  # ── Region targeting table (Metabase, parameterised) ──────────
  - id: meta_realtors_regions
    title: "Meta - Regions based targeting"
    render: region_table
    platform: meta
    metabase_question_spend: 8346
    metabase_question_reg: 8347
    tot_subs_database_id: 74   # roomvu_ads_metrics — all-time active subs per region

  # ── Google Ads slides (Supermetrics + Metabase) ────────────────
  # Matches the marketing team's "New Ads Report Structure - Data Feed" sheet:
  #   Total Return Rate = revenue received that week / acquisition spend
  #   Imm Revenue Rate  = same-week-registration revenue / total spend
  # Acquisition = PPC Social Media + PPC Video + Competitors family
  # (excludes Brand, Demand Gen, Display/Remarketing, Bumper, YT Views).
  - id: google_all_campaigns
    title: "Google - All campaigns"
    render: dual_line_chart
    platform_icon: google
    charts:
      - label: "Total Return Rate"
        source: google_ads_return_rate
        metabase_question: 8475
        numerator_field: total_revenue
        x_field: week
        format: percent
        color: "#4A90D9"
        last_weeks: 46
        spend_basis: acquisition
        acquisition_campaign_ids:
          - "16587957261"   # RV - Registration - PPC Social Media
          - "17809534029"   # RV - Registration - PPC Video
          - "17948075953"   # RV - Registration - Competitors
          - "22265795515"   # RV - Registration - Competitors [IDX]
      - label: "Immediate Revenue Rate"
        source: google_ads_ratio
        database_id: 74
        numerator_sql: google_imm_revenue
        numerator_field: imm_revenue
        x_field: week
        format: percent
        color: "#E8956D"
        last_weeks: 46
        spend_basis: total

  # Google Total Spending (whole account) + CPA (spend / registrations).
  # Mirrors the Data Feed sheet: Total Spending = C, CPA = C / # Registrations.
  - id: google_spend_cpa
    title: "Google - All campaigns"
    render: dual_line_chart
    platform_icon: google
    charts:
      - label: "Google Total Spending"
        source: google_ads_spend
        x_field: week
        format: currency
        color: "#4A90D9"
        last_weeks: 46
        spend_basis: total
      - label: "Google CPA"
        source: google_ads_cpa
        database_id: 74
        x_field: week
        format: currency
        color: "#E8A020"
        last_weeks: 46
        spend_basis: total

  # ── Branded Search (Roomvu Brand campaign) — single-week KPI snapshot ──
  - id: google_branded_search
    title: "Branded Search"
    render: branded_search
    platform_icon: google
    campaign_id: "11179321084"   # Roomvu Brand
    database_id: 74
    ad_preview:
      url: "www.roomvu.com/"
      headline: "Roomvu Video Content Factory - Real Estate Marketing Toolkit"
      description: "Share Branded Real Estate Videos with roomvu. Insightful Videos for You to Convert Leads."
      sitelinks:
        - title: "Latest Market Updates"
          lines: ["Pulled from Local Boards", "Geographically Relevant"]
        - title: "Custom Brokerage Videos"
          lines: ["Designed for Your Brokerage", "Branded with Your Contact Info"]

  # ── Meta & Google combined (Real Estate & MB) ─────────────────────────
  # Facebook (Realtor + Mortgage campaigns) + Google, summed on one Wed-Tue
  # cohort grid (anchor 2025-08-06). Revenue/registrations/immediate are all
  # computed live from db 74 on both channels so they sum consistently:
  #   Total Revenue   = subs + 0.3*SmartAds, payment-week (incl SmartAd margin)
  #   Registrations   = registration-week count, both channels
  #   Imm Return Rate = same-week subscription revenue / total spend
  # Meta spend is the only non-live metric (no FB Supermetrics; ad_analytics
  # campaign bridge empty) — sourced from the RE&MB spend question 8342.
  - id: combined_re_mb
    title: "Meta & Google – Real Estate & MB"
    render: combined_re_mb
    database_id: 74
    anchor: "2025-08-06"
    last_weeks: 46
    meta_spend_q: 8342
    campaign_ids:            # Facebook Realtor + Mortgage Broker (RE&MB segment)
      - "120231753483890603"   # Realtor
      - "120233281815980603"   # Mortgage Broker

  # ── Financial report (Financial & Insurance Agents) — single-week table ──
  # Total Revenue = registration-cohort subs + full SmartAd (succeeded), to date.
  # Insurance's reference $6,449 is a stale hand-entered cell — the automated
  # value is the true ~$2.4k. Meta segment spend from the KPI spend questions.
  - id: fin_report_fin_insurance
    title: "Financial report (Financial & Insurance Agents)"
    render: financial_report
    database_id: 74
    per_row_revenue: true
    note: "Heads-up: Insurance had a 62% charge-failure rate this week (5 of 8 subscription attempts failed) — worth a billing check."
    rows:
      - goal: Acquisition
        channel: "FB (Insurance)"
        spend_q: 8331
        fb_campaigns: ["120233992944810603", "120218175521230626", "120227402303430626"]
      - goal: Acquisition
        channel: "FB (Financial)"
        spend_q: 8336
        fb_campaigns: ["120250806358890603", "120236934764070603"]

  # ── Financial report – Real Estate & MB — single-week table ──
  # Revenue/Imm-Return shown as acquisition aggregate (per_row_revenue: false).
  # Meta funnel-stage spend (FB Acquisition/Retargeting/Awareness, Tests) has no
  # live source -> shown as "—". Google/LinkedIn spend live via Supermetrics.
  - id: fin_report_re_mb
    title: "Financial report – Real Estate & MB"
    render: financial_report
    database_id: 74
    per_row_revenue: false
    rows:
      - goal: Acquisition
        channel: Facebook
        fb_campaigns: ["120231753483890603", "120233281815980603"]   # RE&MB
        spend_q_sum: [8335, 8333]   # Realtor spend + Mortgage spend (KPI questions)
      - goal: Acquisition
        channel: Google
        google: true
        spend_google_campaigns:                # Google acquisition campaigns
          - "16587957261"   # PPC Social Media
          - "17809534029"   # PPC Video
          - "17948075953"   # Competitors
          - "22265795515"
          - "22440586485"
          - "23737726709"
          - "23735196152"
      - {goal: Acquisition, channel: Retargeting}          # Meta funnel — no live source
      - {goal: Acquisition, channel: LinkedIn, spend_linkedin: true}
      - {goal: Tests, channel: "Demand + Open AI"}         # no clean live source
      - {goal: Awareness, channel: Facebook}               # Meta funnel — no live source
      - goal: Awareness
        channel: Google
        spend_google_campaigns:                # Google brand / awareness
          - "11179321084"   # Roomvu Brand
          - "20984261490"   # YT Views
          - "23705925967"   # Bumper Ads [YT]

fixed_columns: [week_idx, week, Registration, Amount_Spent]
