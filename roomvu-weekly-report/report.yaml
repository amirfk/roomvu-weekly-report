    title: "Linkedin - Retargeting"
    icon: linkedin
    creative: creative_linkedin_rt.jpg
    key: linkedin_retargeting
    kpis: [Clicks, Cost, CPC, "Im. Revenue", "Total Revenue"]

  - {type: section, title: Google}

  - type: charts
    title: "Google - All campaigns"
    icon: google
    charts:
      - {title: "Google Total Spending", since: "2025-12-24", format: currency,
         series: [{label: "Google Total Spending", metric: spend, segment: google_all}]}
      - {title: "Google CPA", since: "2025-12-24", format: currency, decimals: 2,
         series: [{label: "Google CPA", metric: cpa, segment: google_all}]}

  - type: charts
