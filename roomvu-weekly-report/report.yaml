    kpis: [Registrations, Cost, CPA, Subscriptions, "Im. Revenue"]

  - {type: section, title: Linkedin, hidden: true}   # hidden in the team's deck

  - type: manual_kpi
    hidden: true                 # hidden in the team's deck
    title: "Linkedin - Registration"
    icon: linkedin
    creative: creative_linkedin_reg.jpg
    key: linkedin_registration
    kpis: [Registrations, Cost, CPA, "Im. Revenue", "Total Revenue"]

  - type: manual_kpi
