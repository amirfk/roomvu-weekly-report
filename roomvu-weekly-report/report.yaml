    icon: google
    note: "Total Return Rate = all Google users' payments that week (Metabase Q8475: raw amounts) ÷ acquisition spend (PPC Social, PPC Video, Competitors). Immediate Revenue Rate = same-week subscription revenue from that week's Google registrants ÷ total Google spend."
    charts:
      - {title: "Total Return Rate", since: "2025-12-24", format: percent, decimals: 2,
         series: [{label: "Total Return Rate", metric: raw_return_rate, revenue_segment: google_all, segment: google_acq}]}
      - {title: "Immediate Revenue Rate", since: "2025-12-24", format: percent, decimals: 1,
         series: [{label: "Immediate Revenue Rate", metric: imm_rate, segment: google_all}]}

  - type: kpi
    title: "Google Ads - Remarketing - Demand Gen"
    creative: creative_demandgen.jpg
    kpis:
      - {label: Registrations, metric: regs, segment: google_remarketing_dg}
      - {label: Cost, metric: spend, segment: google_remarketing_dg}
      - {label: CPA, metric: cpa, segment: google_remarketing_dg}
      - {label: Subscriptions, metric: subs, segment: google_remarketing_dg}
      - {label: "Im. Revenue", metric: imm, segment: google_remarketing_dg}
      - {label: "Tot. Revenue", metric: revenue, segment: google_remarketing_dg}

  - type: kpi
    title: "Branded Search"
    creative: creative_branded.jpg
    creative_wide: true
    kpis:
      - {label: Clicks, metric: clicks, segment: google_brand}
      - {label: Registrations, metric: regs, segment: google_brand}
      - {label: Cost, metric: spend, segment: google_brand}
      - {label: CPA, metric: cpa, segment: google_brand}
      - {label: "Im. Revenue", metric: imm, segment: google_brand}
      - {label: "Tot. Revenue", metric: revenue, segment: google_brand}

  - type: kpi
    hidden: true                 # hidden in the team's deck
    title: "Competitors"
    creative: creative_competitors.jpg
    side_text:
      - "KCM, Wise Agent, Elm Street, Luxury Presence, Back at you, Agent fire, Luxury Presence, Avenue HQ, Property Simple, The paperless agent, Real Geeks, Real Grader, Real Estate Content AI"
      - "IDX- Real Estate Webmasters, IDX Central, CINC, iHomefinder, IDX Broker, Placester, OSI IDX, BoomTown, AgentRoof, Market Leader"
    kpis:
      - {label: Clicks, metric: clicks, segment: google_competitors}
      - {label: Registrations, metric: regs, segment: google_competitors}
      - {label: Cost, metric: spend, segment: google_competitors}
      - {label: CPA, metric: cpa, segment: google_competitors}
      - {label: "Im. Revenue", metric: imm, segment: google_competitors}
      - {label: "Tot. Revenue", metric: revenue, segment: google_competitors}

  - type: charts
    title: "Meta & Google – Real Estate & MB"
    layout: triple
    charts:
      - {title: "", since: "2026-01-07", format: currency,
         series: [{label: "Total Spending", metric: spend, segment: re_mb_all, color: "#4285f4"},
                  {label: "Total Revenue", metric: revenue, segment: re_mb_all_revenue, color: "#ea4335"}]}
      - {title: "Registrations", since: "2026-01-07", format: number,
         series: [{label: Registrations, metric: regs, segment: re_mb_all}]}
      - {title: "Imm. Return Rate", since: "2026-01-07", format: percent, decimals: 2,
         series: [{label: "Imm. Return Rate", metric: imm_rate, segment: re_mb_all}]}

  - type: fin_re
    title: "Financial report – Real Estate & MB"
  - type: fin_ins
    title: "Financial report (Financial & Insurance Agents)"

  - {type: thanks}
