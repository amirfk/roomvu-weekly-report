# ─────────────────────────────────────────────────────────────────────────────
# Weekly "Ads Report" deck — mirrors the team's Google Slides report
# (Facebook → LinkedIn → Google → combined → financial tables).
#
# Report week = the latest COMPLETE Wednesday–Tuesday week (a build on a
# Tuesday reports the previous week; on Wednesday it reports the week that
# ended yesterday).
#
# DEFINITIONS (identical on every slide)
#   Registrations  users.user_type_id != 1, not deleted, utm_source = facebook |
#                  google, utm_campaign prefix in the slide's campaign group,
#                  registered inside the week.
#   Cost / Spend   Meta: ad_analytics (db 74), USD x spend_usd_to_cad; any day
#                  ad_analytics hasn't loaded is filled from Supermetrics
#                  Facebook Ads. Google: Supermetrics Google Ads.
#   Subscriptions  week's registrants who paid a subscription that same week.
#   Im. Revenue    subscription payments made in the registration week by that
#                  week's registrants (succeeded charges, USD x revenue rate).
#   Tot. Revenue   every succeeded payment (subscriptions + Smart Ads) made in
#                  the week by the segment's users, whenever they registered.
#   Sub. rate      registrants who have paid a subscription (to date) / regs.
# ─────────────────────────────────────────────────────────────────────────────

rates:
  revenue_usd_to_cad: 1.3     # Metabase standard for revenue (8330, 8515, 8341 …)
  spend_usd_to_cad: 1.39      # Metabase standard for USD ad accounts

meta_fallback_accounts: ["act_411150471670134", "act_1106920697984482"]   # Roomview Tech (CAD), VU USD
# Facebook's own spend (Supermetrics) is used for every week from this date on:
# ad_analytics kept phantom rows from its 30 Sep 2026 outage (+$32 USD on Realtor).
meta_supermetrics_from: "2026-09-23"

# Realtor region targeting. Current ad sets are mapped automatically from their
# names ("[Register Florida] LAL" -> Florida, "... Test Ads" -> Test); the map
# below covers older ad sets whose names don't follow that pattern.
region_exclude_adsets: ["120237890415710603"]      # Vancouver
region_adset_map:
  "120233341704010603": Florida
  "120233379581620603": All
  "120249589587950603": All
  "120233414684750603": East Coast
  "120233414823840603": California
  "120234497794270603": ON BC
  "120235036284150603": Texas

# Campaign groups (Meta = Facebook campaign IDs, Google = Google Ads campaign IDs).
campaign_groups:
  meta_realtor:                 # RV registration (acquisition)
    - "120231753483890603"      # RV - Registration USD
    - "120212198150270626"      # RV - Registration (CAD, until Aug 2025)
  meta_mb:
    - "120233281815980603"      # MB - Registration USD
    - "120218050516410626"      # MB - Registration (CAD, until Aug 2025)
  meta_re_retargeting:
    - "120237891055470603"      # RV - Retargeting USD
    - "120251369949080603"      # RV - Retargeting [Bootcamp]
    - "120213597156010626"      # RV - Retargeting
    - "120226718961040626"      # RV - Retargeting [Webinar]
    - "120225490501650626"      # RV - Retargeting [Leads]
    - "120215492911670626"      # RV - Retargeting [Leads]
    - "120233662274220603"      # RV - Retargeting [leads] - USD
  meta_re_tests:
    - "120251145916270603"      # RV - Registration [Biocoach]
    - "120252039394690603"      # RV - Integrations
    - "120251141510310603"      # RV - Registration [Create]
    - "120233338995110603"      # RV - Leads USD
    - "120212531014340626"      # RV - Leads
  meta_insurance:
    - "120233992944810603"      # Insurance Registration - USD
    - "120252653396770603"      # Insurance Registration - Advantage+ (USD, from 2 Oct 2026)
    - "120218175521230626"      # Insurance Registration - Advantage+ (CAD, until 2 Oct 2026)
    - "120227402303430626"      # Insurance Registration
  meta_insurance_retargeting:
    - "120252508697720603"      # Insurance - Retargeting USD
  meta_financial:
    - "120236934764070603"      # Finance Registration - Advantage - USD
    - "120250806358890603"      # Finance Registration - LAL - USD
    - "120247201100520626"      # Finance Registration - Detailed Targeting
    - "120236599108480603"      # Finance Registration - USD
    - "120228300262780626"      # Financial Registration - Advantage+
    - "120221486897610626"      # Financial Registrations
  meta_other_verticals:         # not Real Estate / MB
    - "120242514144720603"      # Tax Registration - USD
    - "120249244705120603"      # HI - Registration
  google_acquisition:           # "Total Spending (Acquisition)" + Financial report Google row
    - "16587957261"             # RV - Registration - PPC Social Media
    - "17809534029"             # RV - Registration - PPC Video
    - "17948075953"             # RV - Registration - Competitors
    - "22265795515"             # RV - Registration - Competitors [IDX]
  google_retargeting:
    - "20853114375"             # RV - Registration - Remarketing - Demand Gen
    - "21379357856"             # RV - Registration - Remarketing - Display [Free Users]
  google_tests:
    - "24280998477"             # RV - Registration - Demand Gen (new, Sep 2026)
  google_awareness:
    - "11179321084"             # Roomvu Brand
    - "20984261490"             # RV - Registration - YT Views
    - "23705925967"             # Bumper Ads [YT]
  google_brand: ["11179321084"]
  google_remarketing_dg: ["20853114375"]
  google_competitors:
    - "17948075953"             # RV - Registration - Competitors
    - "22265795515"             # RV - Registration - Competitors [IDX]
  google_insurance_financial:
    - "22605096945"             # RV - Registration - Insurance Agents
    - "22448879276"             # RV - Registration - Financial Advisors
    - "23737726709"             # Competitors [Insurance Agent]
    - "23735196152"             # Competitors [Financial Advisor]

# Segments used by slides. meta / google = include lists (group names or IDs);
# meta_exclude / google_exclude = "everything except"; google: all = whole account.
segments:
  realtor:        {meta: [meta_realtor]}
  mb:             {meta: [meta_mb]}
  realtor_mb:     {meta: [meta_realtor, meta_mb]}
  re_mb_meta:     {meta: [meta_realtor, meta_mb, meta_re_retargeting, meta_re_tests]}
  insurance:      {meta: [meta_insurance]}
  financial:      {meta: [meta_financial]}
  re_tests_meta:  {meta: [meta_re_tests]}
  # Revenue base for Real Estate & MB: every Facebook user who isn't from an
  # Insurance / Financial / other-vertical campaign (renewals from older RE
  # campaigns count). This is the manual report's "Total Revenue" base.
  re_mb_meta_revenue: {meta_exclude: [meta_insurance, meta_insurance_retargeting, meta_financial, meta_other_verticals]}
  google_all:     {google: all}
  google_acq:     {google: [google_acquisition]}
  google_brand:   {google: [google_brand]}
  google_remarketing_dg: {google: [google_remarketing_dg]}
  google_competitors: {google: [google_competitors]}
  google_tests:   {google: [google_tests]}
  re_mb_all:      {meta: [meta_realtor, meta_mb, meta_re_retargeting, meta_re_tests], google: all}
  re_mb_all_revenue: {meta_exclude: [meta_insurance, meta_insurance_retargeting, meta_financial, meta_other_verticals], google: all}

# ── Slides, in the order of the manual deck. hidden: true skips a slide. ─────
slides:
  - {type: title}

  - {type: section, title: Facebook}

  - type: charts
    title: "Meta - Real Estate & MB"
    icon: meta
    charts:
      - {title: "Meta Spending", since: "2025-12-31", format: currency,
         series: [{label: "Meta Spending", metric: spend, segment: re_mb_meta}]}

  - type: charts
    title: "Meta - Real Estate & MB"
    icon: meta
    charts:
      - {title: "Total Return Rate", since: "2025-12-31", format: percent, decimals: 2,
         series: [{label: "Total Return Rate", metric: return_rate, revenue_segment: re_mb_meta_revenue, segment: re_mb_meta}]}
      - {title: "Subscription Rate", since: "2025-12-31", format: percent, decimals: 2,
         series: [{label: "Subscription Rate", metric: sub_rate, segment: re_mb_meta}]}

  - type: kpi_chart
    title: "Meta - Real Estate Acquisition"
    icon: meta
    kpis:
      - {label: Registrations, metric: regs, segment: realtor}
      - {label: Cost, metric: spend, segment: realtor}
    chart: {title: "CPA", since: "2025-09-03", format: currency,
            series: [{label: CPA, metric: cpa, segment: realtor}]}

  - type: kpi_chart
    title: "Meta- Real Estate Post registration"
    icon: meta
    kpis:
      - {label: "RV Registration Revenue", metric: imm, segment: realtor}
      - {label: "Total Revenue", metric: revenue, segment: re_mb_meta_revenue}
    chart: {title: "Immediate return rate", since: "2025-12-31", format: percent, decimals: 0,
            series: [{label: "Immediate return rate", metric: imm_rate, segment: realtor}]}

  - type: regions
    hidden: true                 # hidden in the team's deck
    style: compare            # this week + last week (manual slide "Meta - Regions based targeting")
    title: "Meta -  Regions based targeting"
    header: plain
  - type: regions
    style: summary            # sorted by CPA with Book Demo / ROAS (manual "Meta - Region Based Targeting")
    title: "Meta - Region Based Targeting"
    header: plain_arial

  - type: cohort
    style: gray
    title: "Real estate + MB  Cohort ROI - Meta & Google"
    segment: re_mb_all
    rows: 4
    max_weeks: 4
    week_label_style: long

  - type: image                 # the team's one-off analysis slide, copied as-is
    title: "RV Retargeting: 50% Offer"
    image: static_rv_retargeting_50_offer.png

  - type: retargeting
    hidden: true                 # hidden in the team's deck
    title: "Meta - Retargeting"
    icon: meta
    creative: creative_retargeting.jpg
    meta_groups: [meta_re_retargeting, meta_insurance_retargeting]

  - type: kpi
    title: "Meta - MB Registration"
    icon: meta
    creative: creative_mb.jpg
    kpis:
      - {label: Registrations, metric: regs, segment: mb}
      - {label: Cost, metric: spend, segment: mb}
      - {label: CPA, metric: cpa, segment: mb}
      - {label: "Im. Revenue", metric: imm, segment: mb}

  - type: kpi
    title: "Meta - Insurance Agents Registration"
    icon: meta
    creative: creative_insurance.jpg
    kpis:
      - {label: Registrations, metric: regs, segment: insurance}
      - {label: Cost, metric: spend, segment: insurance}
      - {label: CPA, metric: cpa, segment: insurance}
      - {label: Subscriptions, metric: subs, segment: insurance}
      - {label: "Im. Revenue", metric: imm, segment: insurance}

  - type: cohort
    style: navy
    title: "Meta - Insurance Agents ROI Cohort Weekly"
    icon: meta
    segment: insurance
    rows: 5

  - type: charts
    title: "Meta - Insurance Agents Spend"
    icon: meta
    charts:
      - {title: "Weekly Spend", since: "2025-04-16", format: currency, label_style: range,
         series: [{label: "Weekly Spend", metric: spend, segment: insurance}]}

  - type: charts
    title: "Meta - Insurance Agents CPA & Register - Weekly"
    icon: meta
    charts:
      - {title: "Registrations", since: "2025-11-05", format: number, color: "#e8956d", label_style: range,
         series: [{label: Registrations, metric: regs, segment: insurance}]}
      - {title: "CPA", since: "2025-11-05", format: currency, color: "#e8c84a", label_style: range,
         series: [{label: CPA, metric: cpa, segment: insurance}]}

  - type: kpi
    title: "Meta - Financial Agents Registration"
    icon: meta
    creative: creative_financial.jpg
    kpis:
      - {label: Registrations, metric: regs, segment: financial}
      - {label: Cost, metric: spend, segment: financial}
      - {label: CPA, metric: cpa, segment: financial}
      - {label: Subscriptions, metric: subs, segment: financial}
      - {label: "Im. Revenue", metric: imm, segment: financial}

  - type: cohort                 # hidden in the manual deck (stale since July)
    hidden: true
    style: navy
    title: "Meta - Financial-Planners ROI Cohort Weekly"
    icon: meta
    segment: financial
    rows: 5

  - type: manual_kpi             # campaign isn't in our ad accounts / users table
    hidden: true                 # hidden in the team's deck
    title: "Meta - Tax Agents Registration"
    icon: meta
    creative: creative_tax.jpg
